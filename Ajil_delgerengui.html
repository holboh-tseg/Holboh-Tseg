<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ажлын дэлгэрэнгүй — ХҮРТЭЭМЖ</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Ajil_delgerengui_s.css">
<link rel="stylesheet" href="polish.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a class="wordmark" href="Intro.html">
      <img class="wordmark-knot" src="logo-badge.png" alt="ХАМТ лого" width="76" height="76" style="object-fit:contain;">
      ХҮРТЭЭМЖ
    </a>

    <a class="back-link" id="backLink" href="Main_vol.html">← Буцах</a>

    <div class="topnav-actions">
      <button class="icon-btn" id="logoutBtn" aria-label="Гарах" title="Гарах">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M7 2.5H4a1.5 1.5 0 0 0-1.5 1.5v10A1.5 1.5 0 0 0 4 15.5h3M12.5 12.5 16 9l-3.5-3.5M16 9H6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="avatar" href="Profile_vol.html" aria-label="Профайл" id="avatarInitials">ХД</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="detail-wrap" id="detailWrap">
    <p class="load-state">Ачааллаж байна…</p>
  </div>
</main>

<div class="modal-overlay" id="reportModalOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 style="margin:0; font-size:1.1rem;" id="reportModalTitle">Ажлыг мэдээлэх</h3>
      <button class="modal-close" id="reportModalClose" type="button" aria-label="Хаах">&times;</button>
    </div>
    <div class="modal-field">
      <label for="reportReason">Шалтгаан</label>
      <select id="reportReason">
        <option value="spam">Спам / хуурамч</option>
        <option value="scam">Луйвар / мөнгө шаардсан</option>
        <option value="inappropriate">Зохисгүй контент</option>
        <option value="no_show">Ажил зарлаад юу ч хийгээгүй</option>
        <option value="other">Бусад шалтгаан</option>
      </select>
    </div>
    <div class="modal-field">
      <label for="reportDetails">Дэлгэрэнгүй (заавал биш)</label>
      <textarea id="reportDetails" rows="4" placeholder="Юу болсныг товч бичнэ үү…"></textarea>
    </div>
    <p id="reportStatusMsg" style="font-size:0.85rem; margin:0 0 12px; min-height:1em;"></p>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn-ghost" id="reportModalCancel" type="button">Цуцлах</button>
      <button class="btn-primary" id="reportSubmitBtn" type="button">Илгээх</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="applyModalOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 style="margin:0; font-size:1.1rem;">Бүртгүүлэх</h3>
      <button class="modal-close" id="applyModalClose" type="button" aria-label="Хаах">&times;</button>
    </div>
    <p style="font-size:0.85rem; color:var(--ink-soft); margin:0 0 16px;">Энэ байгууллага туршлагатай сайн дурынхныг хайж байгаа тул дараах асуултад хариулна уу.</p>
    <div class="modal-field">
      <label for="applyExperience" id="applyExperienceLabel">Өмнө ямар туршлага/ажил хийж байсан бэ?</label>
      <textarea id="applyExperience" rows="3" placeholder="Жишээ нь: өмнө нь мод тарих ажилд 2 удаа оролцож байсан…"></textarea>
    </div>
    <div class="modal-field">
      <label for="applyMotivation" id="applyMotivationLabel">Яагаад энэ ажилд нэгдэхийг хүсэж байна вэ?</label>
      <textarea id="applyMotivation" rows="3" placeholder="Юу таныг татаж байгааг товч бичнэ үү…"></textarea>
    </div>
    <p id="applyStatusMsg" style="font-size:0.85rem; margin:0 0 12px; min-height:1em; color:#991B1B;"></p>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn-ghost" id="applyModalCancel" type="button">Болих</button>
      <button class="btn-primary" id="applyModalSubmit" type="button">Бүртгүүлэх</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>© 2026 ХҮРТЭЭМЖ. Сайн дурын ажилтан ба төрийн бус байгууллагыг холбох платформ.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
  const CATEGORY_MAP = {
    environment: { label: 'Байгаль орчин',    tagClass: 'opp-tag--env' },
    education:   { label: 'Боловсрол',        tagClass: 'opp-tag--edu' },
    health:      { label: 'Эрүүл мэнд',       tagClass: 'opp-tag--health' },
    animals:     { label: 'Амьтан хамгаалал', tagClass: 'opp-tag--animal' },
    community:   { label: 'Хамт олны хөгжил', tagClass: 'opp-tag--community' },
    other:       { label: 'Бусад',            tagClass: 'opp-tag--other' }
  };

  const LOGO_COLORS = ['#3E6B4E', '#3E7CA6', '#C96A36', '#C99A3E'];

  let currentProfile = null;
  let opportunity = null;
  let organization = null;
  let applicantCount = 0;
  let myApplication = null; // volunteers only

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function initials(name) {
    return (name || 'ХҮРТЭЭМЖ').split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'ХД';
  }

  function logoColor(seed) {
    let h = 0;
    for (let i = 0; i < (seed || '').length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return LOGO_COLORS[h % LOGO_COLORS.length];
  }

  function formatMonthDay(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return dateStr;
    return `${d.getMonth() + 1}-р сарын ${d.getDate()}`;
  }

  function getOppId() {
    return new URLSearchParams(window.location.search).get('id');
  }

  // ---------- apply / cancel button (volunteers only) ----------
  function applyButtonHtml() {
    const isFull = opportunity.volunteers_needed && applicantCount >= opportunity.volunteers_needed;
    const status = myApplication && myApplication.status;

    if (status === 'pending' || status === 'confirmed') {
      return `<button type="button" class="btn-apply is-applied" id="applyActionBtn" data-mode="cancel">✓ Бүртгүүлсэн</button>`;
    }
    if (status === 'completed') {
      return `<button type="button" class="btn-apply is-applied" disabled>Дуусгасан</button>`;
    }
    if (isFull) {
      return `<button type="button" class="btn-apply is-full" disabled>Дүүрсэн</button>`;
    }
    return `<button type="button" class="btn-apply" id="applyActionBtn" data-mode="apply">Бүртгүүлэх</button>`;
  }

  async function refreshApplicationState() {
    const [stats, myApp] = await Promise.all([
      supabaseClient.from('opportunity_stats').select('applicant_count').eq('opportunity_id', opportunity.id).maybeSingle(),
      currentProfile.role !== 'org' ? getMyApplicationForOpportunity(opportunity.id) : Promise.resolve(null),
    ]);
    applicantCount = (stats.data && stats.data.applicant_count) || 0;
    myApplication = myApp;

    const holder = document.getElementById('applyBtnHolder');
    if (holder) holder.innerHTML = currentProfile.role !== 'org' ? applyButtonHtml() : '';

    const applicantsLabel = document.getElementById('applicantsLabel');
    if (applicantsLabel) applicantsLabel.textContent = applicantsText();
  }

  function applicantsText() {
    return opportunity.volunteers_needed
      ? `${applicantCount}/${opportunity.volunteers_needed} хүн бүртгүүлсэн`
      : `${applicantCount} хүн бүртгүүлсэн`;
  }

  async function submitApplication(btn, extraFields) {
    btn.disabled = true;
    btn.textContent = 'Бүртгэж байна…';
    try {
      const { error } = await supabaseClient
        .from('applications')
        .upsert(
          { opportunity_id: opportunity.id, volunteer_id: currentProfile.id, status: 'pending', ...(extraFields || {}) },
          { onConflict: 'opportunity_id,volunteer_id' }
        );
      if (error) throw error;
      await refreshApplicationState();
    } catch (err) {
      alert('Бүртгүүлэхэд алдаа гарлаа: ' + (err.message || String(err)));
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Бүртгүүлэх';
    }
  }

  function calculateAge(birthdateStr) {
    const today = new Date();
    const birthdate = new Date(birthdateStr);
    let age = today.getFullYear() - birthdate.getFullYear();
    const monthDiff = today.getMonth() - birthdate.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthdate.getDate())) age--;
    return age;
  }

  // The detail view already shows the opportunity's age range (see
  // ageRangeText below) — this is what actually enforces it. Volunteers
  // without a birthdate on file, or opportunities with no age range set,
  // are let through unchanged.
  function ageRestrictionMessage() {
    const { min_age, max_age } = opportunity;
    if (min_age == null && max_age == null) return null;
    if (!currentProfile.birthdate) return null;

    const age = calculateAge(currentProfile.birthdate);
    if (min_age != null && age < min_age) {
      return `Энэ ажилд хамгийн багадаа ${min_age} настай байх шаардлагатай.`;
    }
    if (max_age != null && age > max_age) {
      return `Энэ ажилд хамгийн ихдээ ${max_age} хүртэлх насныхан бүртгүүлэх боломжтой.`;
    }
    return null;
  }

  function handleApply(btn) {
    const ageIssue = ageRestrictionMessage();
    if (ageIssue) {
      alert(ageIssue);
      return;
    }
    if (opportunity.experience_required) {
      openApplyModal(btn);
      return;
    }
    submitApplication(btn);
  }

  async function handleCancel(btn) {
    if (!confirm('Энэ ажлаас бүртгэлээ цуцлах уу?')) return;
    btn.disabled = true;
    btn.textContent = 'Цуцалж байна…';
    try {
      const { error } = await supabaseClient
        .from('applications')
        .delete()
        .eq('opportunity_id', opportunity.id)
        .eq('volunteer_id', currentProfile.id);
      if (error) throw error;
      await refreshApplicationState();
    } catch (err) {
      alert('Цуцлахад алдаа гарлаа: ' + (err.message || String(err)));
      console.error(err);
      btn.disabled = false;
      btn.textContent = '✓ Бүртгүүлсэн';
    }
  }

  document.getElementById('detailWrap').addEventListener('click', (e) => {
    const btn = e.target.closest('#applyActionBtn');
    if (!btn) return;
    if (btn.dataset.mode === 'cancel') handleCancel(btn);
    else handleApply(btn);
  });

  // ---------- render ----------
  function renderDetail() {
    const wrap = document.getElementById('detailWrap');
    const cat = CATEGORY_MAP[opportunity.category] || CATEGORY_MAP.other;
    const orgName = (organization && organization.org_name) || 'Байгууллага';

    const locationLine = opportunity.location_type === 'online'
      ? '💻 Онлайн'
      : `📍 ${escapeHtml(opportunity.location_label || 'Байршил тодорхойгүй')}`;
    const dateLine = opportunity.is_recurring
      ? `🗓 ${escapeHtml(opportunity.schedule_note || 'Тогтмол')}`
      : `🗓 ${opportunity.event_date ? formatMonthDay(opportunity.event_date) : 'Огноо тодорхойгүй'}`;
    const hoursLine = opportunity.hours_estimate ? `⏱ ${opportunity.hours_estimate} цаг` : '';
    const CERT_LABELS = { online: '🎓 Онлайн гэрчилгээ', in_person: '🎓 Биечлэн гэрчилгээ' };
    const certLine = CERT_LABELS[opportunity.certificate_type] || '';

    function formatTime(t) { return t ? t.slice(0, 5) : ''; }
    const timeLine = opportunity.start_time
      ? (opportunity.end_time
          ? `🕐 ${formatTime(opportunity.start_time)}–${formatTime(opportunity.end_time)}`
          : `🕐 ${formatTime(opportunity.start_time)}-с эхэлнэ`)
      : '';

    function ageRangeText(minA, maxA) {
      if (minA != null && maxA != null) return `${minA}–${maxA} нас`;
      if (minA != null) return `${minA}-с дээш нас`;
      if (maxA != null) return `${maxA} хүртэлх нас`;
      return '';
    }
    const ageText = ageRangeText(opportunity.min_age, opportunity.max_age);

    const orgLogoHtml = (organization && organization.avatar_url)
      ? `<img src="${organization.avatar_url}" alt="">`
      : initials(orgName);

    const orgMiniBadgeHtml = organization && organization.verification_status === 'verified'
      ? `<span class="org-badge" data-status="verified">✅ Баталгаажсан</span>`
      : organization && organization.verification_status === 'pending'
      ? `<span class="org-badge" data-status="pending">⏳ Шалгаж байгаа</span>`
      : '';

    const orgMiniHtml = organization ? `
      <div class="org-mini">
        <div class="org-logo" style="width:44px;height:44px;border-radius:12px;font-size:0.85rem;background:${logoColor(orgName)}">${orgLogoHtml}</div>
        <div class="org-mini-text">
          <p class="org-mini-name">${escapeHtml(orgName)}</p>
          ${orgMiniBadgeHtml}
          ${organization.about ? `<p class="org-mini-about">${escapeHtml(organization.about)}</p>` : ''}
        </div>
        ${organization.website ? `<a class="org-mini-link" href="${escapeHtml(organization.website)}" target="_blank" rel="noopener">Вэбсайт →</a>` : ''}
      </div>` : '';

    const experienceSectionHtml = opportunity.experience_required ? `
      <div class="detail-section">
        <h3>🎓 Шаардлагатай туршлага</h3>
        <p class="detail-desc">${escapeHtml(opportunity.experience_needed || 'Энэ ажилд туршлага шаардлагатай гэдгийг л зарлагч дурдсан байна.')}</p>
      </div>` : '';

    const benefitsSectionHtml = opportunity.benefits_provided ? `
      <div class="detail-section">
        <h3>Сайн дурынханд юу өгөгдөх вэ?</h3>
        <p class="detail-desc">${escapeHtml(opportunity.benefits_provided)}</p>
      </div>` : '';

    wrap.innerHTML = `
      <article class="detail-card">
        <div class="detail-top">
          <div class="org-logo" style="background:${logoColor(orgName)}">${orgLogoHtml}</div>
          <div class="detail-top-heading">
            <span class="opp-tag ${cat.tagClass}">${cat.label}</span>
            ${opportunity.experience_required ? `<span class="exp-badge">🎓 Туршлага шаардана</span>` : ''}
            ${ageText ? `<span class="age-badge">🔞 ${ageText}</span>` : ''}
            <h1 class="detail-title">${escapeHtml(opportunity.title)}</h1>
            <p class="detail-org">${escapeHtml(orgName)}${(organization && organization.verification_status === 'verified') ? `<span class="verified-check" title="Баталгаажсан байгууллага">✓</span>` : ''}</p>
          </div>
        </div>

        <div class="detail-meta">
          <span>${locationLine}</span>
          <span>${dateLine}</span>
          ${timeLine ? `<span>${timeLine}</span>` : ''}
          ${hoursLine ? `<span>${hoursLine}</span>` : ''}
          ${certLine ? `<span>${certLine}</span>` : ''}
          <span id="applicantsLabel">${applicantsText()}</span>
        </div>

        <div class="detail-section">
          <h3>Ажлын дэлгэрэнгүй мэдээлэл</h3>
          <p class="detail-desc">${escapeHtml(opportunity.description || 'Энэ ажлын дэлгэрэнгүй тайлбар оруулаагүй байна.')}</p>
        </div>

        ${experienceSectionHtml}
        ${benefitsSectionHtml}
        ${orgMiniHtml}

        <div class="detail-actions">
          <button type="button" class="report-link" id="reportOppBtn">🚩 Мэдээлэх</button>
          <span id="applyBtnHolder">${currentProfile.role !== 'org' ? applyButtonHtml() : ''}</span>
        </div>
      </article>`;

    document.getElementById('reportOppBtn').addEventListener('click', () => {
      openReportModal();
    });
  }

  function renderNotFound(message) {
    document.getElementById('detailWrap').innerHTML = `<div class="error-state">${escapeHtml(message)}</div>`;
  }

  // ---------- boot ----------
  (async () => {
    const session = await requireSession();
    if (!session) return;

    const profile = await getCurrentProfile();
    if (!profile) return;
    currentProfile = profile;

    if (profile.role === 'org') {
      document.body.classList.add('theme-org');
      document.getElementById('backLink').href = 'Busad_ajiluud.html';
      document.getElementById('avatarInitials').href = 'Manai_tukhai.html';
    } else {
      document.getElementById('backLink').href = 'Main_vol.html';
    }

    const name = profile.role === 'org'
      ? (profile.org_name || 'Байгууллага')
      : [profile.first_name, profile.last_name].filter(Boolean).join(' ');
    const avatarEl = document.getElementById('avatarInitials');
    if (profile.avatar_url) {
      avatarEl.innerHTML = `<img src="${profile.avatar_url}" alt="">`;
    } else {
      avatarEl.textContent = initials(name);
    }

    const oppId = getOppId();
    if (!oppId) {
      renderNotFound('Ажлын дугаар олдсонгүй.');
      return;
    }

    try {
      opportunity = await getOpportunityById(oppId);
      if (!opportunity) {
        renderNotFound('Энэ ажил олдсонгүй эсвэл устгагдсан байна.');
        return;
      }

      const [org, stats, myApp] = await Promise.all([
        getOrganizationById(opportunity.org_id),
        supabaseClient.from('opportunity_stats').select('applicant_count').eq('opportunity_id', opportunity.id).maybeSingle(),
        profile.role !== 'org' ? getMyApplicationForOpportunity(opportunity.id) : Promise.resolve(null),
      ]);
      organization = org;
      applicantCount = (stats.data && stats.data.applicant_count) || 0;
      myApplication = myApp;

      renderDetail();
    } catch (err) {
      renderNotFound('Ажлын мэдээллийг татахад алдаа гарлаа: ' + (err.message || String(err)));
      console.error(err);
    }
  })();

  document.getElementById('logoutBtn').addEventListener('click', signOut);

  // ---------- Report modal ----------
  const overlay = document.getElementById('reportModalOverlay');
  const closeBtn = document.getElementById('reportModalClose');
  const cancelBtn = document.getElementById('reportModalCancel');
  const submitBtn = document.getElementById('reportSubmitBtn');
  const titleEl = document.getElementById('reportModalTitle');
  const reasonEl = document.getElementById('reportReason');
  const detailsEl = document.getElementById('reportDetails');
  const statusMsg = document.getElementById('reportStatusMsg');

  function openReportModal() {
    titleEl.textContent = `Мэдээлэх: ${opportunity.title}`;
    statusMsg.textContent = '';
    statusMsg.style.color = '';
    reasonEl.value = 'spam';
    detailsEl.value = '';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Илгээх';
    overlay.hidden = false;
  }
  function closeModal() { overlay.hidden = true; }

  closeBtn.addEventListener('click', closeModal);
  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  submitBtn.addEventListener('click', async () => {
    if (!opportunity) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Илгээж байна…';
    statusMsg.textContent = '';

    const result = await reportOpportunity(opportunity.id, opportunity.org_id, reasonEl.value, detailsEl.value.trim());

    if (result) {
      statusMsg.style.color = '#166534';
      statusMsg.textContent = 'Мэдээллийг хүлээн авлаа. Баярлалаа!';
      submitBtn.textContent = 'Илгээсэн';
      setTimeout(closeModal, 1400);
    } else {
      statusMsg.style.color = '#991B1B';
      statusMsg.textContent = 'Илгээхэд алдаа гарлаа. Дахин оролдоно уу.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Илгээх';
    }
  });

  // ---------- Apply modal (experience-required opportunities) ----------
  (() => {
    const overlay = document.getElementById('applyModalOverlay');
    const closeBtn = document.getElementById('applyModalClose');
    const cancelBtn = document.getElementById('applyModalCancel');
    const submitBtn = document.getElementById('applyModalSubmit');
    const experienceEl = document.getElementById('applyExperience');
    const motivationEl = document.getElementById('applyMotivation');
    const experienceLabel = document.getElementById('applyExperienceLabel');
    const motivationLabel = document.getElementById('applyMotivationLabel');
    const statusMsg = document.getElementById('applyStatusMsg');

    let pendingBtn = null;

    window.openApplyModal = function (btn) {
      pendingBtn = btn;
      statusMsg.textContent = '';
      experienceEl.value = '';
      motivationEl.value = '';
      experienceLabel.textContent = (opportunity && opportunity.experience_question) || 'Өмнө ямар туршлага/ажил хийж байсан бэ?';
      motivationLabel.textContent = (opportunity && opportunity.motivation_question) || 'Яагаад энэ ажилд нэгдэхийг хүсэж байна вэ?';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Бүртгүүлэх';
      overlay.hidden = false;
    };
    function closeModal() { overlay.hidden = true; }

    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    submitBtn.addEventListener('click', async () => {
      if (!pendingBtn) return;
      const experience = experienceEl.value.trim();
      const motivation = motivationEl.value.trim();
      if (!experience || !motivation) {
        statusMsg.textContent = 'Хоёр асуултад хариулна уу.';
        return;
      }
      statusMsg.textContent = '';
      await submitApplication(pendingBtn, {
        applicant_experience: experience,
        applicant_motivation: motivation
      });
      closeModal();
    });
  })();
</script>

</body>
</html>
