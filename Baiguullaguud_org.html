<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="notifications-ui.js"></script>
<script>
  const ORG_LOGO_COLORS = ['#3E6B4E', '#3E7CA6', '#C96A36', '#C99A3E', '#7A4FA3'];

  function orgInitials(name) {
    return (name || '')
      .split(' ')
      .filter(Boolean)
      .slice(0, 2)
      .map(w => w[0].toUpperCase())
      .join('') || '??';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function orgLogoHtml(org) {
    if (org.avatarUrl) {
      return `<span class="org-logo org-logo--lg org-logo--photo"><img src="${escapeHtml(org.avatarUrl)}" alt=""></span>`;
    }
    return `<span class="org-logo org-logo--lg" style="background:${orgColor(org.orgName)}">${orgInitials(org.orgName)}</span>`;
  }

  function socialLinksHtml(org) {
    const links = (org.socialLinks || []).filter(s => s && s.url);
    if (!links.length) return '';
    return `<div class="org-card-socials">${links.map(s => `
      <a class="social-pill" href="${escapeHtml(s.url)}" target="_blank" rel="noopener" title="${escapeHtml(s.platform || 'Холбоос')}" onclick="event.stopPropagation()">${escapeHtml((s.platform || '#').trim().charAt(0).toUpperCase() || '#')}</a>
    `).join('')}</div>`;
  }

  function orgColor(name) {
    let hash = 0;
    for (const ch of (name || '')) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
    return ORG_LOGO_COLORS[hash % ORG_LOGO_COLORS.length];
  }

  function renderOrganizations(orgs) {
    const grid = document.getElementById('orgGrid');
    const empty = document.getElementById('orgEmpty');
    grid.querySelectorAll('.org-card').forEach(el => el.remove());

    if (orgs.length === 0) {
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    for (const org of orgs) {
      const badge = org.verificationStatus === 'verified'
        ? `<span class="org-badge" data-status="verified">✅ Баталгаажсан</span>`
        : org.verificationStatus === 'pending'
        ? `<span class="org-badge" data-status="pending">⏳ Шалгаж байгаа</span>`
        : '';

      const card = document.createElement('div');
      card.className = 'org-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.addEventListener('click', () => {
        window.location.href = `Baiguullaga_profile_org.html?id=${encodeURIComponent(org.id)}`;
      });
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          window.location.href = `Baiguullaga_profile_org.html?id=${encodeURIComponent(org.id)}`;
        }
      });
      card.innerHTML = `
        <div class="org-card-top">
          ${orgLogoHtml(org)}
          <div class="org-card-heading">
            <p class="org-name">${escapeHtml(org.orgName || '')}</p>
            ${badge}
          </div>
        </div>
        <p class="org-desc">${escapeHtml(org.about || '')}</p>
        ${socialLinksHtml(org)}
        <div class="org-card-foot">
          <span>${escapeHtml(org.category || 'Ангилалгүй')}</span>
          <span>${org.jobCount} ажил</span>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  async function loadOrganizations(search = '') {
    const orgs = await getOrganizationsDirectory(search);
    renderOrganizations(orgs);
  }

  (async () => {
    const session = await requireSession(); // redirects to login.html if not signed in
    if (!session) return;

    const profile = await getCurrentProfile();
    if (profile) {
      if (profile.role !== 'org') {
        window.location.href = 'Main_vol.html';
        return;
      }
      const name = profile.org_name || 'Байгууллага';
      const g = document.getElementById('greeting');
      if (g) g.textContent = `Сайн байна уу, ${name} 👋`;
      const av = document.getElementById('avatarInitials');
      if (av) {
        if (profile.avatar_url) {
          av.innerHTML = `<img src="${profile.avatar_url}" alt="">`;
        } else {
          av.textContent = orgInitials(name);
        }
      }
    }

    await loadOrganizations();
  })();

  document.getElementById('orgSearchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const term = document.getElementById('orgSearchInput').value;
    loadOrganizations(term);
  });

  document.getElementById('logoutBtn').addEventListener('click', signOut);
</script>

</body>
